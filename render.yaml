services:
  # ── FastAPI Backend Service ──────────────────────────────
  - type: web
    name: researchpilot-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: LLM_MODEL
        value: open-mistral-7b
      - key: MISTRAL_API_KEY
        sync: false # Set in Render dashboard
      - key: PYTHONUNBUFFERED
        value: "1"

  # ── React + Vite Frontend Static Site ─────────────────────
  - type: web
    name: researchpilot
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Render's fromService/property:host cross-service reference doesn't
      # support URL templating, so this is hardcoded to the actual backend
      # URL. Update this if the backend service is ever renamed/recreated.
      - key: VITE_API_BASE_URL
        value: https://researchpilot-backend-jobz.onrender.com/api
