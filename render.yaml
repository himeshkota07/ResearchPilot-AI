services:
  # ── FastAPI Backend Service ──────────────────────────────
  - type: web
    name: researchpilot-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: LLM_MODEL
        value: open-mistral-7b
      - key: MISTRAL_API_KEY
        sync: false # Set in Render dashboard

  # ── React + Vite Frontend Static Site ─────────────────────
  - type: web
    name: researchpilot-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: researchpilot-backend
          property: host
        transformation: "https://{{.host}}/api"
